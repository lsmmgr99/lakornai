# AiLakorn — commit เนื้อหา → ตรวจ V1–V13 → build artifact → ส่งขึ้น GitHub Pages   (AIO-30 · ADR-001 §9, §12, §14)
#
# สอง job แยกสิทธิ์กันชัด:
#   validate-build-artifact  ทุก branch / ทุก PR · อ่านอย่างเดียว · ปลายทางคือ artifact ที่ผ่านด่านครบ
#   publish-site             เฉพาะ push ขึ้น main หลัง job แรกผ่าน · contents: write เฉพาะ job นี้
#                            เอา artifact ชุดเดียวกันไป force-push ขึ้น branch `preview` ที่ GitHub Pages เสิร์ฟ
#                            (ADR-001 §14 — ลูกค้าสั่ง 29 ต.ค. 2026 ให้ปิดวงจร "แก้ในแผง → เว็บอัปเดตเอง")
#
# ค่าที่ตั้งได้จาก Settings → Secrets and variables → Actions → Variables (ไม่ต้องแก้ไฟล์นี้):
#   SITE_ORIGIN     origin ของเว็บที่เสิร์ฟจริง เช่น https://ailakorn.com · ไม่ตั้ง = https://lsmmgr99.github.io/lakornai
#   SITE_PUBLISHED  1 = robots.txt เปิดให้เก็บดัชนี · ไม่ตั้ง = Disallow ทั้งเว็บ (รอบทดสอบ)
#   PAGES_CNAME     โดเมนที่ผูกกับ Pages เช่น ailakorn.com — ตั้ง "หลัง" ชี้ DNS แล้วเท่านั้น · ไม่ตั้ง = ไม่เขียน CNAME
#
# ตรวจซ้ำในเครื่องได้โดยไม่ต้อง push:   node ci/rehearse.mjs --head
# (ลำดับขั้นข้างล่างถูกบังคับให้ตรงกับ ci/pipeline.mjs โดย ci/pipeline.test.mjs)

name: content-ci

on:
  # §9.2 — "อัตโนมัติเมื่อมี commit ที่แตะ content.json" ไม่มีตารางเวลา ไม่ต้องรอใครสั่ง
  # ปกก็ปลุกด้วย เพราะกฎ V6/V15 ผูกกับการมีไฟล์ปกจริง และปกเป็น path ที่ broker เขียนได้ตาม B7
  push:
    paths:
      - 'content.json'
      - 'assets/covers/**'
      - 'assets/covers-wide/**'
      # ตัวตรวจและตัว build เองก็ปลุก — ถ้าคนแก้ด่านแล้วด่านไม่ได้รัน ด่านนั้นก็เท่ากับไม่มี
      - 'admin/validate.mjs'
      - 'admin/check.mjs'
      - 'build/**'
      - 'ci/**'
      - '.github/workflows/content-ci.yml'
  pull_request:
    paths:
      - 'content.json'
      - 'assets/covers/**'
      - 'assets/covers-wide/**'
      - 'admin/validate.mjs'
      - 'admin/check.mjs'
      - 'build/**'
      - 'ci/**'
      - '.github/workflows/content-ci.yml'
  workflow_dispatch:

# ค่าตั้งต้นของทั้ง workflow = อ่านอย่างเดียว · job publish-site ขอ contents: write เพิ่มเฉพาะตัวมันเอง
permissions:
  contents: read

# commit เนื้อหาติด ๆ กันไม่ต้องรอกันให้ครบ แต่ของ branch เดียวกันเอาผลล่าสุดพอ
concurrency:
  group: content-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ไม่มี package.json ในรีโปนี้ (ADR-001 §1) จึงไม่มี dependency ให้ติดตั้ง และไม่มี cache ให้กู้
      - name: ตั้ง Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ทดสอบตัวด่านเอง
        run: node --test ci/views-gate.test.mjs ci/pipeline.test.mjs ci/deploy-branch.test.mjs

      # ---- ด่านก่อน build: ข้อมูลผิดต้องล้มที่นี่ ไม่ใช่ไปโผล่บนเว็บ ----
      - name: ตรวจข้อมูล V1–V10 ก่อน build
        run: node admin/check.mjs .

      - name: build HTML static
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://lsmmgr99.github.io/lakornai' }}
          SITE_PUBLISHED: ${{ vars.SITE_PUBLISHED || '0' }}
        run: node build/build.mjs

      # ---- ด่านหลัง build: ตรวจไฟล์ที่เขียนลงดิสก์จริง ----
      - name: ตรวจ V11 หลัง build (ปิด JS แล้วต้องอ่านเนื้อหาได้)
        run: node admin/check.mjs . --html

      - name: ตรวจ V12–V13 หลัง build
        run: node ci/views-gate.mjs .

      # ---- artifact: ขั้นนี้อยู่ท้ายสุดของ job นี้ ข้อมูลผิดจึงไม่มีทางได้ artifact ----
      - name: จัด build artifact
        run: node ci/stage-artifact.mjs . _artifact

      - name: เก็บ artifact (ให้ดาวน์โหลดได้ และเป็นชุดเดียวกับที่ job ถัดไปส่งขึ้นเว็บ)
        uses: actions/upload-artifact@v4
        with:
          name: lakornai-static-${{ github.sha }}
          path: _artifact
          if-no-files-found: error
          retention-days: 14

  publish-site:
    needs: validate-build-artifact
    # เฉพาะ commit ที่เข้า main จริง — PR และ branch อื่น (รวม branch ร่างของ broker) ได้แค่ artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # ส่งขึ้นทีละชุดตามลำดับ ไม่ยกเลิกกันเอง — ชุดหลังต้องทับชุดก่อนเสมอ
    concurrency:
      group: publish-site
      cancel-in-progress: false
    steps:
      - name: checkout (เอาเฉพาะสคริปต์ ci/ มาใช้ ไม่ build ซ้ำ)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ตั้ง Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ดึง artifact ชุดที่ผ่านด่านแล้วจาก job ก่อนหน้า
        uses: actions/download-artifact@v4
        with:
          name: lakornai-static-${{ github.sha }}
          path: _artifact

      # สคริปต์ตรวจชุดไฟล์ซ้ำด้วย publish-gate ก่อน push · token ส่งผ่าน env ของ git ไม่อยู่ใน argv/log
      - name: ส่งชุดไฟล์ขึ้น branch ของ GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_BRANCH: preview
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: node ci/deploy-branch.mjs _artifact
