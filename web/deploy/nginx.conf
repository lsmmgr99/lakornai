# nginx หน้า Next.js — ailakorn.com (ใส่ที่ /etc/nginx/sites-available/ailakorn แล้ว symlink เข้า sites-enabled)
# ใบรับรอง: certbot --nginx -d ailakorn.com -d www.ailakorn.com
server {
    listen 80;
    server_name ailakorn.com www.ailakorn.com;
    return 301 https://ailakorn.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.ailakorn.com;
    # ssl_certificate … (certbot เติมให้)
    return 301 https://ailakorn.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name ailakorn.com;
    # ssl_certificate /etc/letsencrypt/live/ailakorn.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ailakorn.com/privkey.pem;

    client_max_body_size 8m;          # อัปโหลดปก/ภาพกว้างจากหลังบ้าน
    gzip on; gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml;

    # ไฟล์ static ของ Next (hash ในชื่อ) cache ยาว
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # ปกและไฟล์ย่อยทุกขนาด (UPLOAD_DIR) — nginx เสิร์ฟตรงจากดิสก์ ไม่ผ่าน Node · มีนามสกุล .webp ⇒ Cloudflare แคชที่ edge ให้
    # (แก้ path ให้ตรงกับ UPLOAD_DIR ของเครื่อง · ชื่อไฟล์ใหม่ทุกครั้งที่อัปโหลดจึง cache ยาวได้)
    location /media/ {
        alias /opt/ailakorn/web/data/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
